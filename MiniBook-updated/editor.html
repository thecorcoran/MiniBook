<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Book Editor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .active-page {
            outline: 2px solid #007bff;
            outline-offset: -2px;
        }

        /* Screen canvas guide indicators */
        .cut-guide-center {
            position: absolute;
            left: 25%;
            width: 50%;
            top: 50%;
            height: 0;
            border-top: 2px dashed #444;
            z-index: 5;
            pointer-events: none;
        }

        .cut-guide-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 0 4px;
            font-size: 9px;
            color: #666;
            letter-spacing: 0.5px;
        }

        @media print {
            @page {
                size: letter landscape; /* 11in x 8.5in standard US Letter */
                margin: 0;
            }
            body {
                margin: 0;
                padding: 0;
                background: #fff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            body > *:not(.editor-main) { display: none !important; }
            header, footer, .toolbar { display: none !important; }
            .editor-main { width: 100%; height: 100%; margin: 0; padding: 0; display: block; }
            #canvas-container { width: 100%; height: 100%; padding: 0; margin: 0; overflow: visible; }
            #canvas {
                width: 11in;
                height: 8.5in;
                margin: 0;
                border: none;
                box-shadow: none;
                box-sizing: border-box;
                position: relative;
                overflow: hidden;
            }
            .page-grid {
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 0;
                border: none;
                background-color: transparent;
            }
            .page-grid.four-page {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
            .page-cell {
                border: 1px dotted #ccc !important;
                position: relative;
                box-sizing: border-box;
                overflow: hidden;
            }
            .cut-guide-center {
                border-top: 1.5px dashed #000 !important;
            }
            .cut-guide-label {
                display: none !important;
            }
            .active-page {
                outline: none !important;
            }
            .resize-handle {
                display: none !important;
            }
            .text-box {
                border: none !important;
                background-color: transparent !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html" style="color: #333;">Mini-Book Maker</a></div>
            <ul>
                <li><a href="templates.html">Browse Templates</a></li>
                <li><a href="index.html#features">Features</a></li>
            </ul>
        </nav>
    </header>

    <main class="editor-main">
        <div class="toolbar">
            <button id="add-text-button">➕ Add Text</button>
            <button id="add-image-button">🖼️ Add Image</button>
            <button id="print-button" class="print-button">🖨️ Print Sheet</button>
            <div class="toolbar-hint">
                <p><strong>Print Tip:</strong> Select <em>Landscape</em> orientation and <em>None / Default</em> margins in your browser's print dialog.</p>
            </div>
        </div>
        <div id="canvas-container">
            <div id="canvas">
                <div class="cut-guide-center">
                    <span class="cut-guide-label">✂ CUT SLIT</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Mini-Book Maker. All rights reserved.</p>
    </footer>

    <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
    <script src="book-data.js"></script>
    <script src="editor.js"></script>
</body>
</html>
